<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>See you again Nursing</title>
    <meta
      name="description"
      content="A soft scrapbook gift for Mod, Nok, and Tukta — from your big brother."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fredoka:wght@400;500;600&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>
    <div class="floaters" id="floaters" aria-hidden="true"></div>

    <div id="music-gate" class="music-gate" hidden>
      <button type="button" class="music-gate-card" id="music-gate-btn">
        <span class="music-gate-heart" aria-hidden="true">♡</span>
        <span class="music-gate-title">See you again Nursing</span>
        <span class="music-gate-hint">Tap to open</span>
      </button>
    </div>

    <main class="frame" id="app">
      <!-- Views are rendered by script.js -->
    </main>

    <button
      type="button"
      class="music-toggle"
      id="music-toggle"
      aria-label="Toggle background music"
      aria-pressed="false"
      title="Music"
    >
      <span class="music-toggle-icon" aria-hidden="true">♪</span>
    </button>

    <audio id="bg-music" src="audio/bgm.mp3" loop preload="auto" playsinline></audio>

    <script src="script.js"></script>
  </body>
</html>
